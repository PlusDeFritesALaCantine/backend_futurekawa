apiVersion: apps/v1
kind: Deployment
metadata:
  name: futurekawa-backend
  namespace: futurekawa-app
  labels:
    app: futurekawa-backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: futurekawa-backend
  template:
    metadata:
      labels:
        app: futurekawa-backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: ghcr.io/plusdefritesalacantine/backend_futurekawa:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
              name: http
          env:
            - name: API_PORT
              value: "8002"
            - name: BRESIL_API_URL
              value: "http://futurekawa-api-service:8001"
            - name: EQUATEUR_API_URL
              value: "http://futurekawa-api-service:8001"
            - name: COLOMBIE_API_URL
              value: "http://futurekawa-api-service:8001"
            
            - name: ODOO_URL
              value: "http://odoo-service:8069"
            - name: ODOO_DB
              value: "futurekawa" 
            - name: ODOO_USERNAME
              value: "admin"
            - name: ODOO_API_KEY
              value: "admin"
            - name: ODOO_DRY_RUN
              value: "false"
            - name: BACKEND_FUTUREKAWA_URL
              value: "http://localhost:8002"

          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"